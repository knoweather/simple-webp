<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>simple-webp · WASM decoder demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; }
    canvas { border: 1px solid #ccc; image-rendering: pixelated; max-width: 100%; }
    #info { color: #555; margin-top: .5rem; }
    #err { color: #c00; margin-top: .5rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>simple-webp · WASM decoder (read only)</h1>
  <p>Pick a <code>.webp</code> file to decode it entirely in the browser.</p>
  <input id="file" type="file" accept=".webp,image/webp" />
  <div id="err"></div>
  <canvas id="canvas"></canvas>
  <div id="info"></div>

  <!-- WASM glue provided by the Go toolchain. -->
  <script src="wasm_exec.js"></script>
  <script>
    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject)
      .then((result) => {
        go.run(result.instance);
        document.getElementById("info").textContent =
          "wasm ready — pick a .webp file";
      })
      .catch((e) => {
        document.getElementById("err").textContent = "failed to load wasm: " + e;
      });

    document.getElementById("file").addEventListener("change", (ev) => {
      const file = ev.target.files[0];
      if (!file) return;
      document.getElementById("err").textContent = "";
      file.arrayBuffer().then((buf) => {
        const bytes = new Uint8Array(buf);

        // Peek the container metadata first (no pixel decode).
        const info = webpInfo(bytes);
        if (info.error) {
          document.getElementById("err").textContent = "info error: " + info.error;
          return;
        }

        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        // Animated file: play every frame with webpDecodeFrames.
        if (info.hasAnimation && info.frameCount > 0) {
          const frames = webpDecodeFrames(bytes);
          if (frames.error) {
            document.getElementById("err").textContent = "decode error: " + frames.error;
            return;
          }
          canvas.width = frames[0].width;
          canvas.height = frames[0].height;
          let i = 0;
          const draw = () => {
            const f = frames[i];
            ctx.putImageData(
              new ImageData(new Uint8ClampedArray(f.rgba), f.width, f.height),
              0, 0
            );
            document.getElementById("info").textContent =
              `${f.width}×${f.height}  frame ${i + 1}/${frames.length}` +
              `  ${f.duration}ms  icc=${info.hasICC} exif=${info.hasEXIF} xmp=${info.hasXMP}`;
            const d = f.duration > 0 ? f.duration : 100;
            i = (i + 1) % frames.length;
            setTimeout(draw, d);
          };
          draw();
          return;
        }

        // Still image: decode once with webpDecode (also reads the first frame
        // of any animation the metadata did not flag).
        const res = webpDecode(bytes);
        if (res.error) {
          document.getElementById("err").textContent = "decode error: " + res.error;
          return;
        }
        canvas.width = res.width;
        canvas.height = res.height;
        // rgba is a Uint8Array; ImageData needs Uint8ClampedArray.
        const imgData = new ImageData(
          new Uint8ClampedArray(res.rgba),
          res.width,
          res.height
        );
        ctx.putImageData(imgData, 0, 0);
        document.getElementById("info").textContent =
          `${res.width}×${res.height}  ` +
          `alpha=${res.hasAlpha}  ` +
          `icc=${info.hasICC}  exif=${info.hasEXIF}  xmp=${info.hasXMP}`;
      });
    });
  </script>
</body>
</html>
